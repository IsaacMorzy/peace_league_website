# ============================================================================
# peaceleagueafrica.org -- POST-CERTBOT canonical state
# ============================================================================
# This file mirrors what `/etc/nginx/conf.d/peaceleagueafrica-le.conf` should
# look like AFTER:
#   1) `certbot --nginx --redirect` succeeds (creates the 301 redirects on
#      port 80 plus the new 443 server block with ssl_certificate paths).
#   2) The HSTS directive is added to the certbot-generated 443 server block
#      (certbot's --nginx plugin does NOT auto-propagate `add_header` to
#      the new 443 vhost, so we add it manually via `sed`).
#   3) The two `location ~` rate-limit blocks are injected into the 443 vhost
#      (cite of the catchall's http-level `limit_req_zone login/api` zones).
#   4) An HTTPS `www` canonical redirect vhost is added so SEO does not see
#      dual-ranked URLs.
#
# Recovery procedure (if /etc/nginx/conf.d/peaceleagueafrica-le.conf is lost
# / corrupted by a botched certbot renewal run):
#
#   # 1) Re-issue / re-install the cert.
#   sudo certbot --nginx --redirect \
#     -d peaceleagueafrica.org -d www.peaceleagueafrica.org \
#     -m admin@peaceleagueafrica.org --no-eff-email --agree-tos
#   # 2) Restore this file path on top of certbot's output (re-adds HSTS,
#   #    rate-limit, and the HTTPS www canonical vhost).
#   sudo cp scripts/peaceleagueafrica-le.conf /etc/nginx/conf.d/
#   # 3) Validate and reload.
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zones `login:10m rate=5r/m` and `api:10m rate=300r/m` are declared at http
# level in /etc/nginx/conf.d/frappe-multitenant.conf (single source of truth
# for the whole bench); this file just APPLIES them to its /login and
# /api/method/* locations.

# --- WWW 80: HTTP->HTTPS version + apex canonical ---
server {
    listen 80;
    listen [::]:80;
    server_name www.peaceleagueafrica.org;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/;
        default_type "text/plain";
    }

    return 301 https://peaceleagueafrica.org$request_uri;
}

# --- Apex 80: cert anchor + ACME endpoint ---
server {
    listen 80;
    listen [::]:80;
    server_name peaceleagueafrica.org;

    # Match the catchall's 50 MB upload cap.
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/;
        default_type "text/plain";
    }

    # certbot --redirect replaced the original location / with this 301.
    return 301 https://$host$request_uri;
}

# --- Apex 443 (HTTPS) -- main serving vhost with rate-limits + HSTS ---
server {
    listen 161.97.86.175:443 ssl http2;

    server_name peaceleagueafrica.org;

    # Document root for static asset + private file + X-Accel-Redirect serving.
    # Lets /assets/*, /files/*, /protected/* resolve to relative paths on disk
    # (sites/<app>/dist/ or sites/peaceleagueafrica.localhost/public/...).
    root /home/crowd/Documents/backend/frappe-bench/sites;

    ssl_certificate /etc/letsencrypt/live/peaceleagueafrica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peaceleagueafrica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- Compression: gzip all compressible responses ----
    # nginx.conf globally has `gzip on` but `gzip_types` is commented out, so
    # default behavior compresses ONLY text/html. Override here so CSS/JS/JSON/
    # SVG/xml ship gzipped — bandwidth savings ~110 KiB on /, ~1 MiB on /causes.
    # gzip_vary: sends Vary: Accept-Encoding so cached responses don't poison.
    # gzip_min_length 256: don't bother compressing tiny responses.
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;

    # Rate-limit /login and /api/method/login endpoints (5r/m burst=2 nodelay
    # gives 1 baseline + 2 burst = 3 attempts before HTTP 429).
    location ~ ^/(login|api/method/login)$ {
        limit_req zone=login burst=2 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name peaceleagueafrica.localhost;
        proxy_set_header Host $host;
        proxy_set_header Connection "";          # Enable upstream keepalive (defined upstream frappe-bench-frappe { keepalive 32; } in frappe-multitenant.conf)
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;                 # Was 60 < gunicorn -t 120 → recycled workers caused visible 504s. Now aligned so gunicorn owns the kill decision.
        proxy_connect_timeout 5;
        proxy_redirect off;
        proxy_pass http://frappe-bench-frappe;
    }

    # Rate-limit all other API method calls (300r/m burst=20).
    location ~ ^/api/method/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name peaceleagueafrica.localhost;
        proxy_set_header Host $host;
        proxy_set_header Connection "";          # Enable upstream keepalive
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;                 # Was 60 < gunicorn -t 120
        proxy_connect_timeout 5;
        proxy_redirect off;
        proxy_pass http://frappe-bench-frappe;
    }

    # ---- Static asset serving (CSS/JS bundles, hashed, immutable) ----
    # Mirrors frappe-multitenant.conf: hashed bundles from sites/<app>/dist/
    # never change at the same URL, so cache them for a year.
    # HSTS: re-declared because any add_header in a child location silently
    # drops the parent server's Strict-Transport-Security (nginx semantics).
    # Closes wayfinder #141 (latent shadow first introduced when this block was
    # added; previously only caught in the new /_astro/ block via #140 review).
    location /assets {
        try_files $uri =404;
        add_header Cache-Control "max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ---- Astro hashed bundles (sites/.../public/_astro/*) ----
    # These are hashed by Vite so they're effectively immutable — cache them
    # for a year. Resources served: ~1 MiB of JS/CSS per cold visit; cache means
    # repeat visits download 0.
    # HSTS: re-declared here because any add_header in a child location silently
    # drops the parent server's Strict-Transport-Security (nginx semantics).
    # access_log off in main log keeps noise low; dump to a side log so cache-miss
    # debugging and deploy-fail-skew are still diagnosable.
    location ^~ /_astro/ {
        try_files /peaceleagueafrica.localhost/public$uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        access_log /var/log/nginx/astro-assets.log;
    }

    # ---- Private file store (File documents uploaded by users) ----
    # Bench-managed files live under sites/<site>/public/files/. Resolved
    # directly without re-proxying through gunicorn.
    location /files {
        try_files /peaceleagueafrica.localhost/public/$uri =404;
    }

    # ---- X-Accel-Redirect target for gunicorn-issued internal redirects ----
    # When bench returns X-Accel-Redirect: /protected/..., nginx serves it from
    # disk internally (never re-exposed to the client). ^~ enforces prefix match
    # even though none of our regex locations would conflict.
    location ^~ /protected {
        internal;
        try_files /peaceleagueafrica.localhost/$uri =404;
    }

    # Main app + static marketing site + socket.io-like paths fall through here.
    # The Astro marketing build is shipped to sites/peaceleagueafrica.localhost/public
    # (each page is <name>/index.html). Try the static file first, then the
    # folder-index, then fall through to the @apex_web named location which
    # proxies to gunicorn for /login, /desk, /api/* etc.
    location / {
        try_files /peaceleagueafrica.localhost/public$uri /peaceleagueafrica.localhost/public$uri/index.html /peaceleagueafrica.localhost/public/index.html @peaceleagueafrica_apex_web;
    }

    location @peaceleagueafrica_apex_web {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name peaceleagueafrica.localhost;
        proxy_set_header Host $host;
        proxy_set_header Connection "";          # Enable upstream keepalive
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;                 # Was 60 < gunicorn -t 120
        proxy_connect_timeout 5;
        proxy_redirect off;
        proxy_pass http://frappe-bench-frappe;
    }

    # Error pages: bench-template HTML for predictable UX when gunicorn is down
    # or under surge. Mirrors the catchall's #502 / #429 handling in
    # frappe-multitenant.conf so this site's errors look identical to its peers.
    error_page 502 /502.html;
    error_page 429 /429.html;
    location /502.html {
        root /home/crowd/.local/share/uv/tools/frappe-bench/lib/python3.14/site-packages/bench/config/templates;
        internal;
    }
}

# --- WWW 443 (HTTPS): apex canonical at TLS layer ---
server {
    listen 161.97.86.175:443 ssl http2;

    server_name www.peaceleagueafrica.org;

    ssl_certificate /etc/letsencrypt/live/peaceleagueafrica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peaceleagueafrica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 301 https://peaceleagueafrica.org$request_uri;
}
